name: Update Homebrew Formula

# On a vX.Y.Z tag, points Formula/markdown-preview.rb in badriram/homebrew-tools at the new
# GitHub source tarball and its SHA256. Needs the HOMEBREW_TAP_TOKEN secret: a fine-grained token
# with Contents read/write on badriram/homebrew-tools only.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  update-formula:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $TAG is not vX.Y.Z"; exit 1; }

      - name: Download tarball and compute SHA256
        id: sha
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz" -o release.tar.gz
          SHA256=$(sha256sum release.tar.gz | cut -d' ' -f1)
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Bad checksum"; exit 1; }
          echo "SHA256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: badriram/homebrew-tools
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tools

      - name: Update formula
        env:
          SHA256: ${{ steps.sha.outputs.SHA256 }}
        run: |
          cd homebrew-tools
          sed -i -E "s|url \"https://github.com/badriram/markdown-preview/archive/refs/tags/v[0-9.]+\.tar\.gz\"|url \"https://github.com/badriram/markdown-preview/archive/refs/tags/${TAG}.tar.gz\"|" Formula/markdown-preview.rb
          sed -i -E "s|^(  sha256 )\"[0-9a-f]+\"|\1\"${SHA256}\"|" Formula/markdown-preview.rb
          git diff --stat

      - name: Commit and push
        run: |
          cd homebrew-tools
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/markdown-preview.rb
          git diff --cached --quiet && { echo "Formula already at $TAG"; exit 0; }
          git commit -m "Bump markdown-preview to $TAG"
          git push
